<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採用コンシェルジュ｜テスト環境</title>
</head>
<body>
<script>
(async () => {
  try {
    const response = await fetch('index.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('index.html の取得に失敗しました: ' + response.status);

    let html = await response.text();

    // 本番データではなく、テスト用にアップロードした生成データを読み込む
    html = html.replace(
      '<script src="content-data.js"><\\/script>',
      '<script src="content-data-test.js"><\\/script>'
    );

    // テスト閲覧で本番の行動ログを汚さない
    html = html.replace(
      /const ACTION_LOG_ENDPOINT = "[^"]*";/,
      'const ACTION_LOG_ENDPOINT = ""; // TEST: 本番ログへ送信しない'
    );

    // テスト環境であることをブラウザタイトルだけで識別
    html = html.replace(
      '<title>採用コンシェルジュ｜のぞみ整形外科</title>',
      '<title>【TEST】採用コンシェルジュ｜のぞみ整形外科</title>'
    );

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML =
      '<div style="font-family:sans-serif;padding:24px;line-height:1.8">' +
      '<h1>テストページを読み込めませんでした</h1>' +
      '<p>' + String(error.message || error) + '</p>' +
      '<p>index.html と content-data-test.js が同じGitHubリポジトリ直下にあるか確認してください。</p>' +
      '</div>';
  }
})();
</script>
</body>
</html>

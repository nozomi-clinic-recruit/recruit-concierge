<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>理学療法士 採用コンシェルジュ｜のぞみ整形外科</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    #recruit-frame{display:block;width:100%;height:100%;border:0}
    #fallback{display:none;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;line-height:1.8}
  </style>
</head>
<body>
  <iframe id="recruit-frame" src="./index.html" title="理学療法士 採用コンシェルジュ"></iframe>
  <div id="fallback">
    <p>採用コンシェルジュを開いています。</p>
    <p><a href="./index.html">表示されない場合はこちら</a></p>
  </div>
  <script>
    const frame = document.getElementById('recruit-frame');
    const fallback = document.getElementById('fallback');

    frame.addEventListener('load', () => {
      try {
        const app = frame.contentWindow;
        if (typeof app.selectJob === 'function') {
          app.selectJob('理学療法士');
        } else {
          throw new Error('selectJob is not available');
        }
      } catch (error) {
        frame.style.display = 'none';
        fallback.style.display = 'block';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採用コンシェルジュ｜テスト環境 v3</title>
</head>
<body>
<script>
(async () => {
  try {
    const response = await fetch('./index.html?testv=3', { cache: 'no-store' });
    if (!response.ok) {
      throw new Error('index.html の取得に失敗しました: ' + response.status);
    }

    let html = await response.text();

    // content-data.js の読み込みを、現在GitHub上にあるテスト用ファイルへ差し替え
    const dataTagPattern = /<script\s+src=["']content-data\.js["']\s*>\s*<\/script>/i;

    if (!dataTagPattern.test(html)) {
      throw new Error('index.html 内の content-data.js 読み込み箇所を検出できませんでした。');
    }

    html = html.replace(
      dataTagPattern,
      '<script src="content-data-test.js.js"><\/script>'
    );

    // テスト閲覧では本番の行動ログへ送信しない
    html = html.replace(
      /const\s+ACTION_LOG_ENDPOINT\s*=\s*"[^"]*"\s*;/,
      'const ACTION_LOG_ENDPOINT = ""; // TEST: 本番ログへ送信しない'
    );

    // ブラウザタブでテスト環境と分かるようにする
    html = html.replace(
      /<title>[\s\S]*?<\/title>/i,
      '<title>【TEST v3】採用コンシェルジュ｜のぞみ整形外科<\/title>'
    );

    document.open();
    document.write(html);
    document.close();

  } catch (error) {
    document.body.innerHTML =
      '<div style="font-family:sans-serif;padding:24px;line-height:1.8">' +
      '<h1>テストページを読み込めませんでした</h1>' +
      '<p>' + String(error.message || error) + '</p>' +
      '<p>本番サイトには影響ありません。</p>' +
      '</div>';
  }
})();
</script>
</body>
</html>
